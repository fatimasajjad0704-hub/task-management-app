{% extends "base.html" %}
{% block title %}Add Task{% endblock %}
{% block heading %}Add Task{% endblock %}

{% block content %}
<form method="post" action="{{ url_for('add_task') }}" class="card form">
  <label for="title">Title *</label>
  <input type="text" id="title" name="title" value="{{ task.title }}" maxlength="100" required autofocus>

  <label for="description">Description</label>
  <textarea id="description" name="description" rows="4">{{ task.description }}</textarea>

  <div class="form-row">
    <div>
      <label for="priority">Priority</label>
      <select id="priority" name="priority">
        {% for p in PRIORITIES %}<option value="{{ p }}" {{ 'selected' if p == task.priority }}>{{ p }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label for="status">Status</label>
      <select id="status" name="status">
        {% for s in STATUSES %}<option value="{{ s }}" {{ 'selected' if s == task.status }}>{{ s }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label for="due_date">Due date</label>
      <input type="date" id="due_date" name="due_date" value="{{ task.due_date or '' }}">
    </div>
  </div>

  <p class="muted">The creation date is saved automatically.</p>
  <div class="actions">
    <button type="submit" class="btn">Create task</button>
    <a href="{{ url_for('tasks') }}" class="btn btn-ghost">Cancel</a>
  </div>
</form>
{% endblock %}
